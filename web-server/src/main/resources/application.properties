spring.application.name=lockmng

#db
spring.datasource.url=jdbc:postgresql://localhost:5432/lockmng-db
spring.datasource.username=lockmng-db
spring.datasource.password=lockmng-db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.platform=postgres

#db-init
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never
spring.session.jdbc.initialize-schema=never

#logging
logging.level.root=INFO
logging.level.jp.oecu.lockmng.repository.jpa=INFO
logging.file.path=log
spring.output.ansi.enabled=always