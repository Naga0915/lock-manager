<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>エラーページ</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Georgia, serif;
      background-color: #fff;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .error-code {
      color: red;
      font-size: 64px;
      font-weight: bold;
      opacity: 0;
      transform: scale(0.5) translateY(20px);
      animation: popIn 30.5s ease-out forwards;
      text-align: center;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.5) translateY(20px);
      }
      60% {
        opacity: 1;
        transform: scale(1.05) translateY(-5px);
      }
      100% {
        transform: scale(1) translateY(0);
      }
    }

    .error-detail {
      font-size: 16px;
      margin: 5px 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="error-code">404 Not Found</div>

  <div class="error-detail" th:text="'exception: ' + ${exception}"></div>
  <div class="error-detail" th:text="'message: ' + ${message}"></div>
  <div class="error-detail" th:text="'errors: ' + ${errors}"></div>
  <div class="error-detail" th:text="'trace: ' + ${trace}"></div>
  <div class="error-detail" th:text="'path: ' + ${path}"></div> -->
</body>
</html>
