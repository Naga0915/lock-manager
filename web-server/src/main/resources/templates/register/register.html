<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" dir="ltr">
<head th:replace="~{fragments/head :: head(~{::additionalHead})}">
    <th:block th:fragment="additionalHead">
        <title>新規ユーザ登録</title>
        <!-- ヘッダに追加する場合ここに書く -->
    </th:block>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <form th:action="@{/register}" method="post">
        <input type="hidden" name="registrationId" th:value="${id}" />
        <input type="text" name="userId" placeholder="ユーザID" required />
        <input type="text" name="userName" placeholder="ユーザ名" required />
        <input type="email" name="userEmail" placeholder="Eメールアドレス" />
        <input type="tel" name="userPhoneNumber" placeholder="電話番号" />
        <input type="password" name="password" placeholder="パスワード" required />
        <input type="password" name="passwordCheck" placeholder="パスワード確認" required />
        <label for="isDisclaimed"><a href="/disclaimer" target="_blank">免責事項</a>に同意します</label>
        <input type="checkbox" name="disclaimed" id="isDisclaimed" required />
        <button type="submit">Login</button>
    </form>
    <div th:if="${msg != null}">
        <div class="alert alert-success" role="alert">
            メッセージ: <span th:text="${msg}"></span>
        </div>
    </div>
</body>
</html>
