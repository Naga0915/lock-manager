<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規ユーザ登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <h1>新規ユーザの登録</h1>
    <form th:action="@{/register}" method="post">
        <input type="hidden" name="registrationId" th:value="${id}" />
        <input type="text" name="userId" placeholder="ユーザID" required />
        <input type="text" name="userName" placeholder="ユーザ名" required />
        <input type="email" name="userEmail" placeholder="Eメールアドレス" />
        <input type="tel" name="userPhoneNumber" placeholder="電話番号" />
        <input type="password" name="password" placeholder="パスワード" required />
        <input type="password" name="passwordCheck" placeholder="パスワード確認" required />
        <button type="submit">Login</button>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    </form>
    <div th:if="${msg != null}">
        <div class="alert alert-success" role="alert">
            メッセージ: <span th:text="${msg}"></span>
        </div>
    </div>
</body>
</html>
