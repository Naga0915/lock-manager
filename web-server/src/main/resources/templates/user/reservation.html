<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" dir="ltr">
<head th:replace="~{fragments/head :: head(~{::additionalHead})}">
  <th:block th:fragment="additionalHead">
    <title>ロッカー使用状況可視化</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta name="param_year" th:content="${year}" />
    <meta name="param_month" th:content="${month}" />
    <meta name="param_day" th:content="${day}" />
    <meta name="param_lockNum" th:content="${lockNum}" />

    <style>
      .shape-container-bs {
        height: 50px;
      }
      .dynamic-div-shape {
        height: 50px;
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        font-size: 12px;
        border-radius: 4px;
      }
      .time-bar {
        position: relative;
        background: #eee;
      }
    </style>
  </th:block>
</head>

<body>
  <!-- タイムライン -->
  <div class="w-100 p-3 position-relative bg-light">
    <span class="position-absolute top-50 start-0 translate-middle-y">00:00</span>
    <span class="position-absolute top-50 start-50 translate-middle-y">12:00</span>
    <span class="position-absolute top-50 end-0 translate-middle-y">24:00</span>
  </div>

  <!-- ロッカー可視化 -->
  <div id="shape-container" class="d-flex flex-column gap-2"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      sub();
      setInterval(sub, 10000);
    });

    async function sub() {
      const token = document.querySelector('meta[name="_csrf"]').content;
      const header = document.querySelector('meta[name="_csrf_header"]').content;
      const year = document.querySelector('meta[name="param_year"]').content;
      const month = document.querySelector('meta[name="param_month"]').content;
      const day = document.querySelector('meta[name="param_day"]').content;
      const lockNum = parseInt(document.querySelector('meta[name="param_lockNum"]').content, 10);

      const shapeContainer = document.getElementById("shape-container");
      shapeContainer.innerHTML = "";

      for (let lockId = 0; lockId < lockNum; lockId++) {
        // 1行（1ロッカー）を作る
        const rowContainer = document.createElement("div");
        rowContainer.classList.add('position-relative', 'shape-container-bs', 'border', 'rounded', 'time-bar');

        // ラベル
        const label = document.createElement("span");
        label.textContent = `ロッカー ${lockId}`;
        label.style.position = "absolute";
        label.style.left = "5px";
        label.style.top = "50%";
        label.style.transform = "translateY(-50%)";
        label.style.fontWeight = "bold";
        rowContainer.appendChild(label);

        shapeContainer.appendChild(rowContainer);

        try {
          const response = await fetch("/api/resv/get", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              [header]: token
            },
            body: JSON.stringify({ year, month, day, lockId })
          });

          const data = await response.json();

          if (data.success && Array.isArray(data.list)) {
            data.list.forEach((pair) => {
              const div = document.createElement("div");
              div.classList.add('dynamic-div-shape');

              // 幅と位置を算出（左端0%〜右端100%）
              const start = pair[0];
              const end = pair[1];
              const width = (end - start) * 100;
              const left = start * 100;

              div.style.left = `${left}%`;
              div.style.width = `${width}%`;
              div.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 50%)`;

              const startTime = formatTime(start);
              const endTime = formatTime(end);

              div.title = `${startTime} ～ ${endTime}`;

              div.textContent = `${startTime} - ${endTime}`;

              rowContainer.appendChild(div);
            });
          } else {
            console.log(`ロッカー ${lockId} は予約なし`);
          }

        } catch (err) {
          console.error(`ロッカー ${lockId} の取得エラー:`, err);
        }
      }
    }

    function formatTime(fraction) {
      const total = Math.round(fraction * 24 * 60);
      const h = Math.floor(total / 60).toString().padStart(2, "0");
      const m = (total % 60).toString().padStart(2, "0");
      return `${h}:${m}`;
    }
  </script>
</body>
</html>
