<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" dir="ltr">
<head th:replace="~{fragments/head :: head(~{::additionalHead})}">
  <th:block th:fragment="additionalHead">
    <title>ユーザ用電子錠操作画面</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <style>
      td {
        width:10vmin;
        height: 10vmin;
        vertical-align: middle;
        cursor: pointer;
      }
      table, td {
        border: 2vmin solid #000;
      }
    </style>
  </th:block>
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>
  <h1 class="my-4">ユーザ用の電子錠の操作画面</h1>
  <div th:if="${msg != null}">
      <div class="alert alert-success" role="alert">
          メッセージ: <span th:text="${msg}"></span>
      </div>
  </div>
  <div class="container mb-3">
    <span class="badge bg-success me-2">解錠中</span>
    <span class="badge bg-danger me-2">施錠中</span>
    <span class="badge bg-secondary">不明/未登録</span>
  </div>

  <div id="lockerContainer" class="container"></div>

  <script>
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    let lastStateMap = {};
    let reservedIds = new Set();
    let activeCell = null;
    let activeLockerId = null;

    function createLockerTable() {
      const container = document.getElementById('lockerContainer');
      container.innerHTML = '';

      const table = document.createElement('table');
      table.classList.add('table', 'table-bordered', 'mx-auto');

      const ids = Array.from(reservedIds).sort((a, b) => a - b);
      const columns = 5;
      const rows = Math.ceil(ids.length / columns);
      let index = 0;

      for (let i = 0; i < rows; i++) {
        const tr = document.createElement('tr');
        for (let j = 0; j < columns; j++) {
          const td = document.createElement('td');
          td.classList.add('border');

          if (index < ids.length) {
            const id = ids[index];
            td.textContent = id;
            td.dataset.lockerId = id;
            td.classList.add('text-white');

            const state = lastStateMap[id];
            td.classList.add(state === "u" ? "bg-success" : state === "l" ? "bg-danger" : "bg-secondary");

            td.addEventListener('click', () => {
              showOperationButtons(id, td);
            });

            if (id == activeLockerId) {
              showOperationButtons(id, td); // 再描画時にメニュー復元
            }

            index++;
          } else {
            td.classList.add('bg-light');
          }

          tr.appendChild(td);
        }
        table.appendChild(tr);
      }

      container.appendChild(table);
    }

    function showOperationButtons(lockerId, targetCell) {
      if (activeCell && activeCell !== targetCell) {
        resetCellContent(activeCell);
      }

      const buttonContainer = document.createElement('div');
      ['LOCK', 'UNLOCK'].forEach(op => {
        const btn = document.createElement('button');
        btn.textContent = op;
        btn.className = 'btn btn-sm m-1 ' + (op === 'LOCK' ? 'btn-danger' : 'btn-success');
        btn.onclick = (e) => {
          e.stopPropagation();
          submitLockForm(lockerId, op);
        };
        buttonContainer.appendChild(btn);
      });

      targetCell.innerHTML = '';
      targetCell.appendChild(buttonContainer);
      activeCell = targetCell;
      activeLockerId = lockerId;
    }

    function resetCellContent(cell) {
      const lockerId = parseInt(cell.dataset.lockerId, 10);
      cell.innerHTML = lockerId;
      cell.className = 'border text-white';

      const state = lastStateMap[lockerId];
      if (state === "u") {
        cell.classList.add('bg-success');
      } else if (state === "l") {
        cell.classList.add('bg-danger');
      } else {
        cell.classList.add('bg-secondary');
      }

      cell.addEventListener('click', () => {
        showOperationButtons(lockerId, cell);
      }, { once: true });

      activeCell = null;
      activeLockerId = null;
    }

    function submitLockForm(lockerId, operation) {
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = '/user/lock';

      const inputId = document.createElement('input');
      inputId.type = 'hidden';
      inputId.name = 'lockId';
      inputId.value = lockerId;

      const inputOp = document.createElement('input');
      inputOp.type = 'hidden';
      inputOp.name = 'operation';
      inputOp.value = operation;

      const csrfInput = document.createElement('input');
      csrfInput.type = 'hidden';
      csrfInput.name = '_csrf';
      csrfInput.value = csrfToken;

      form.appendChild(inputId);
      form.appendChild(inputOp);
      form.appendChild(csrfInput);

      document.body.appendChild(form);
      form.submit();
    }

    document.addEventListener('click', (e) => {
      if (activeCell && !activeCell.contains(e.target)) {
        resetCellContent(activeCell);
      }
    });

    function fetchReservedIdsAndStates() {
      fetch("/api/lock/reserved", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          [csrfHeader]: csrfToken
        }
      })
      .then(res => res.json())
      .then(ids => {
        reservedIds = new Set(ids);
        fetchStates(); // 状態を取得したあとでテーブル描画
      })
      .catch(err => {
        console.error("予約取得失敗:", err);
      });
    }

    function fetchStates() {
      fetch("/api/lock/get", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          [csrfHeader]: csrfToken
        }
      })
      .then(res => res.json())
      .then(data => {
        lastStateMap = {};
        data.forEach(lock => {
          lastStateMap[lock.id] = lock.state;
        });

        createLockerTable();
      })
      .catch(err => {
        console.error("状態取得失敗:", err);
      });
    }

    // 初回実行 & 定期更新
    fetchReservedIdsAndStates();
    setInterval(fetchReservedIdsAndStates, 3000);
  </script>

</body>
</html>
