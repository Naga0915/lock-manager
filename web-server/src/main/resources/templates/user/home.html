<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" dir="ltr">
<head th:replace="~{fragments/head :: head(~{::additionalHead})}">
  <th:block th:fragment="additionalHead">
    <title>ユーザ用画面</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </th:block>
</head>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">
  <h2 class="mb-4 text-center">ロッカー予約管理</h2>

  <!-- ロッカー状況（表を上に） -->
  <div class="row row-cols-5 g-2 mb-4">
    <!-- 各セルをループで出力する想定 -->
    <div class="col">
      <div class="p-3 bg-danger text-white text-center">1</div>
    </div>
    <div class="col">
      <div class="p-3 bg-success text-white text-center">2</div>
    </div>
    <!-- 以下、同様に追加 -->
    <!-- 例として20個出す場合は繰り返し構造を使う（Thymeleafなどで） -->
  </div>

  <!-- 料金表とサイドメニュー -->
  <div class="row">
    <div class="col-md-6 mb-3">
      <div class="border p-3">
        <h3 class="h5">料金表</h3>
        <p>ここに料金情報を記載します。</p>
      </div>
    </div>

    <div class="col-md-6">
      <div class="d-flex flex-column">
        <a href="#" class="btn btn-outline-primary mb-2">使用方法</a>
        <a href="#" class="btn btn-outline-primary mb-2">支払方法</a>
        <a href="/admin/resv" class="btn btn-outline-primary mb-2">予約</a>
        <a href="#" class="btn btn-outline-primary">質問フォーム</a>
      </div>
    </div>
  </div>
</div>

<!-- BootstrapのJS（必要なら） -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
