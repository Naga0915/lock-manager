<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(~{::additionalHead})}">
  <th:block th:fragment="additionalHead">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ロッカー予約状況</title>

    <!-- CSRF -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
      table {
        border-collapse: collapse;
      }
      td {
        min-width: 80px;
        height: 80px;
        text-align: center;
        vertical-align: middle;
        font-weight: bold;
        border: 2px solid #000;
        cursor: default;
        white-space: pre-line;
      }
      .bg-danger {
        background-color: #dc3545 !important;
        color: white;
      }
      .bg-success {
        background-color: #28a745 !important;
        color: white;
      }
      .bg-light {
        background-color: #f8f9fa !important;
      }
    </style>
  </th:block>
</head>

<body>
  <div th:replace="~{fragments/header :: header}"></div>

  <div class="container mt-4">
    <h2 class="mb-4 text-center">ロッカー予約状況</h2>

    <div class="table-responsive mb-4">
      <table id="lockerTable" class="mx-auto"></table>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <div class="border p-3">
          <h3 class="h5">料金表</h3>
          <p>
            1時間 100円<br>
            3時間 200円<br>
            6時間 400円<br>
            12時間 500円<br>
            24時間 600円
          </p>
        </div>
      </div>

      <div class="col-md-6">
        <div class="d-flex flex-column">
          <a href="/user/register_guide" class="btn btn-outline-primary mb-2">登録方法</a>
          <a href="/user/method" class="btn btn-outline-primary mb-2">予約方法及び使用方法</a>
          <a href="#" class="btn btn-outline-primary mb-2">支払方法</a>
          <a href="/admin/resv" class="btn btn-outline-primary mb-2">予約</a>
          <a href="/user/faq" class="btn btn-outline-primary mb-2">よくある質問｜Q&A</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const columns = 5; // 列数
    const rows = 4;    // 行数
    const lockerCount = columns * rows;

    async function loadLockerStatus() {
      const token = document.querySelector('meta[name="_csrf"]').content;
      const header = document.querySelector('meta[name="_csrf_header"]').content;

      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const day = now.getDate();

      const hour = now.getHours();
      const minutes = now.getMinutes();
      const totalHours = (hour + (minutes / 60)) /24;

      console.log(`年: ${year}, 月: ${month}, 日: ${day}`);

      const reserved = [];

      for (let lockId = 0; lockId < lockerCount; lockId++) {
        try {
          const response = await fetch('/api/resv/get', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              [header]: token
            },
            body: JSON.stringify({ year, month, day, lockId })
          });

          const data = await response.json();

          
          if (data.success && Array.isArray(data.list) && data.list.length > 0) {
            data.list.forEach((pair) => {
              const start = pair[0];
              const end = pair[1];
              console.log("start：" + start + "\nend：" + end + "\ntotalhour：" + totalHours);
              if(start <= totalHours && totalHours <= end){
                reserved.push(lockId + 1); // 表示番号に合わせて +1
              }
            });
          }
        } catch (error) {
          console.error(`鍵ID ${lockId} の取得失敗:`, error);
        }
      }

      createLockerTable(lockerCount, reserved);
    }

    function createLockerTable(count, reserved) {
      const table = document.getElementById('lockerTable');
      table.innerHTML = '';
      let lockerNumber = 1;

      for (let i = 0; i < rows; i++) {
        const tr = document.createElement('tr');
        for (let j = 0; j < columns; j++) {
          const td = document.createElement('td');
          if (lockerNumber <= count) {
            td.textContent = lockerNumber;
            if (reserved.includes(lockerNumber)) {
              td.classList.add('bg-danger', 'text-white');
              td.title = '予約済み';
            } else {
              td.classList.add('bg-success', 'text-white');
              td.title = '空き';
            }
            lockerNumber++;
          } else {
            td.classList.add('bg-light');
          }
          tr.appendChild(td);
        }
        table.appendChild(tr);
      }
    }

    loadLockerStatus();
  </script>

</body>
</html>
