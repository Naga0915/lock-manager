<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" dir="ltr">
<head th:replace="~{fragments/head :: head(~{::additionalHead})}">
  <th:block th:fragment="additionalHead">
    <title>ユーザ用画面</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      td {
        width: 10vmin;
        height: 10vmin;
        vertical-align: middle;
        text-align: center;
      }
      table, td {
        border: 2vmin solid #000; /* 黒の太い枠線 */
      }
    </style>
  </th:block>
</head>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">
  <h2 class="mb-4 text-center">ロッカー予約管理</h2>

  <!-- JavaScriptで生成されるロッカー表 -->
  <div id="lockerContainer" class="mb-4"></div>

  <!-- 料金表とサイドメニュー -->
  <div class="row">
    <div class="col-md-6 mb-3">
      <div class="border p-3">
        <h3 class="h5">料金表</h3>
        <p>ここに料金情報を記載します。</p>
      </div>
    </div>

    <div class="col-md-6">
      <div class="d-flex flex-column">
        <a href="/user/register_guide" class="btn btn-outline-primary mb-2">登録方法</a>
        <a href="#" class="btn btn-outline-primary mb-2">使用方法</a>
        <a href="#" class="btn btn-outline-primary mb-2">支払方法</a>
        <a href="/admin/resv" class="btn btn-outline-primary mb-2">予約</a>
        <a href="/user/QandA" class="btn btn-outline-primary mb-2">よくある質問｜Q&A</a>
        <a href="#" class="btn btn-outline-primary">質問フォーム</a>
      </div>
    </div>
  </div>
</div>

<!-- BootstrapのJS（必要なら） -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const lockerCount = 15; // ロッカー数
  // サーバーから取得すると想定するデータ
  // 例：予約されているロッカー番号の配列
  const reservedLockers = [2, 5, 7, 12]; // 例として予約済みロッカー

  function createLockerTable(count, reserved) {
    const container = document.getElementById('lockerContainer');
    container.innerHTML = '';

    const table = document.createElement('table');
    table.classList.add('table', 'table-bordered', 'mx-auto');

    const columns = 5; // 列数
    const rows = Math.ceil(count / columns);

    let lockerNumber = 1;

    for (let i = 0; i < rows; i++) {
      const tr = document.createElement('tr');
      for (let j = 0; j < columns; j++) {
        const td = document.createElement('td');
        td.classList.add('border');

        if (lockerNumber <= count) {
          td.textContent = lockerNumber;

          if (reserved.includes(lockerNumber)) {
            td.classList.add('bg-danger', 'text-white'); // 赤: 予約済み
          } else {
            td.classList.add('bg-success', 'text-white'); // 緑: 空き
          }

          lockerNumber++;
        } else {
          td.classList.add('bg-light');
        }
        tr.appendChild(td);
      }
      table.appendChild(tr);
    }
    container.appendChild(table);
  }

  createLockerTable(lockerCount, reservedLockers);
</script>
</body>
</html>
