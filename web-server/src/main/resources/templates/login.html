<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <h1>ログイン画面</h1>
    <form th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="ユーザID" required />
        <input type="password" name="password" id="inPassword" placeholder="パスワード" required />
        <button class="btn btn-outline-secondary" type="button" id="toggle-password">
            <i class="bi bi-eye-slash" id="eyeIcon"></i>
        </button>
        <button type="submit">Login</button>
    </form>
    <div th:if="${param.s != null and param.s[0] == '0'}">
    パスワードかユーザーIDが違います
    </div>
    <div th:if="${param.s != null and param.s[0] == '1'}">
    You have been logged out.
    </div>

    <script>
      // eyeIconのclickクリックイベント
      $("#eyeIcon").on("click", () => {
        // eyeIconのclass切り替え
        $("#eyeIcon").toggleClass("bi-eye-slash bi-eye");

        // inputのtype切り替え
        if ($("#inPassword").attr("type") == "password") {
          $("#inPassword").attr("type", "text");
        } else {
          $("#inPassword").attr("type", "password");
        }
      });
    </script>

</body>
</html>
