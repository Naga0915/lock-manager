<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" dir="ltr">
  <head th:replace="~{fragments/head :: head(~{::additionalHead})}">
  <th:block th:fragment="additionalHead">
    <title>ESP-LOCK</title>
    <!-- ヘッダに追加する場合ここに書く -->
    <style>
        .TD_Link{
            background-color: #E4F3FF;
            cursor: pointer;
            color: #0066CC;
            font-weight: bold;
        }

        .Table_MendanCAL{
            border-right: 1px solid #CCC;
            border-bottom: 1px solid #CCC;
            width: 80%;
            margin-bottom: 13px;
            table-layout: fixed;
        }

        .Table_MendanCAL td {
            height: 60px;
            padding: 10px;
            border-top: 1px solid #CCC;
            border-left: 1px solid #CCC;
            background-color: #FFF;
            color: #666;
            font-size: 12px;
            vertical-align: top;
        }
    </style>
  </th:block>
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>
  <!-- ここから内容 -->
    <div class="container mt-5">
        <div class="text-center">
            <h1>吹き溜まり</h1>

            <p>ようこそ、<span th:text="${username}"></span>様</p>
            <a href="/user/reser" class="btn btn-primary mb-4">今すぐ予約</a>

            <p>あなたの予約状況</p>
            <a href="/user/resv" class="btn btn-success">日時・ロッカー番号</a>
        </div>
    </div>

    <h3 style="text-align:center">カレンダーで予約状況を表示</h3>

</html>
