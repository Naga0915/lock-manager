<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者用電子錠操作画面</title>

<!-- BootstrapのCDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  td {
    width:10vmin;
    height: 10vmin;
    vertical-align: middle;
    cursor: pointer;
  }
  /* 太い枠線を強調したい場合 */
  table, td {
    border: 2vmin solid #000; /* 黒の太めの枠線 */
  }
</style>
</head>

<body class="text-center">
<h1 class="my-4">管理者用の電子錠の操作画面</h1>

<div id="lockerContainer" class="container"></div>

<!-- BootstrapのJS（必要に応じて） -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const lockerCount = 15; // 任意に変更できる（サーバーから受け取るイメージ）

  function createLockerTable(count) {
    const container = document.getElementById('lockerContainer');
    container.innerHTML = ''; // クリア

    const table = document.createElement('table');
    table.classList.add('table', 'table-bordered', 'mx-auto'); // 中央寄せ

    const columns = 5; // 列数
    const rows = Math.ceil(count / columns);

    let lockerNumber = 1;

    for (let i = 0; i < rows; i++) {
      const tr = document.createElement('tr');
      for (let j = 0; j < columns; j++) {
        const td = document.createElement('td');
        td.classList.add('border'); // Bootstrapのborderクラスを明示的に追加

        if (lockerNumber <= count) {
          td.textContent = lockerNumber;
          td.classList.add('bg-success', 'text-white'); // 緑：空き
          td.addEventListener('click', () => {
            const action = confirm(`ロッカー ${lockerNumber} を開錠しますか？`);
            if (action) {
              alert(`ロッカー ${lockerNumber} を開錠しました`);
              // ここにサーバー通信などの開錠処理を組み込む
            }
          });
          lockerNumber++;
        } else {
          td.classList.add('bg-light'); // 空セル
        }
        tr.appendChild(td);
      }
      table.appendChild(tr);
    }
    container.appendChild(table);
  }

  createLockerTable(lockerCount);
</script>
</body>
</html>
