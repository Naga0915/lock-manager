<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" dir="ltr">
<head th:replace="~{fragments/head :: head(~{::additionalHead})}">
    <th:block th:fragment="additionalHead">
        <title>管理者用電子錠操作画面</title>
        <!-- ヘッダに追加する場合ここに書く -->
        <meta name="_csrf" th:content="${_csrf.token}" />
        <meta name="_csrf_header" th:content="${_csrf.headerName}" />
        <meta name="param_lockNum" th:content="${lockNum}" />
         <style>
          td {
            width:10vmin;
            height: 10vmin;
            vertical-align: middle;
            cursor: pointer;
          }
          /* 太い枠線を強調したい場合 */
          table, td {
            border: 2vmin solid #000; /* 黒の太めの枠線 */
          }
        </style>
    </th:block>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <h1 class="my-4">管理者用の電子錠の操作画面</h1>
    <div th:if="${msg != null}">
        <div class="alert alert-success" role="alert">
            メッセージ: <span th:text="${msg}"></span>
        </div>
    </div>
    <div class="container mb-3">
      <span class="badge bg-success me-2">解錠中</span>
      <span class="badge bg-danger me-2">施錠中</span>
      <span class="badge bg-secondary">不明/未登録</span>
    </div>
    <div id="lockerContainer" class="container"></div>
    <script>
      const lockerCount = parseInt(document.querySelector('meta[name="param_lockNum"]').content, 10);
      const csrfToken = document.querySelector('meta[name="_csrf"]').content;
      const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

      let activeCell = null;

      function createLockerTable(count) {
        const container = document.getElementById('lockerContainer');
        container.innerHTML = '';

        const table = document.createElement('table');
        table.classList.add('table', 'table-bordered', 'mx-auto');

        const columns = 5;
        const rows = Math.ceil(count / columns);

        let lockerNumber = 0;

        for (let i = 0; i < rows; i++) {
          const tr = document.createElement('tr');
          for (let j = 0; j < columns; j++) {
            const td = document.createElement('td');
            td.classList.add('border');

            if (lockerNumber < count) {
              const currentLockerId = lockerNumber;
              td.textContent = currentLockerId;
              td.dataset.lockerId = currentLockerId;
              td.classList.add('bg-success', 'text-white');
              td.addEventListener('click', () => {
                showOperationButtons(currentLockerId, td);
              });
              lockerNumber++;
            } else {
              td.classList.add('bg-light');
            }

            tr.appendChild(td);
          }
          table.appendChild(tr);
        }

        container.appendChild(table);
      }

      function showOperationButtons(lockerId, targetCell) {
        if (activeCell && activeCell !== targetCell) {
          resetCellContent(activeCell);
        }

        const buttonContainer = document.createElement('div');

        ['LOCK', 'UNLOCK'].forEach(op => {
          const btn = document.createElement('button');
          btn.textContent = op;
          btn.className = 'btn btn-sm m-1 ' + (op === 'LOCK' ? 'btn-danger' : 'btn-success');
          btn.onclick = (e) => {
            e.stopPropagation();
            submitLockForm(lockerId, op);
          };
          buttonContainer.appendChild(btn);
        });

        targetCell.innerHTML = '';
        targetCell.appendChild(buttonContainer);
        activeCell = targetCell;
      }

      function resetCellContent(cell) {
        const lockerId = parseInt(cell.dataset.lockerId, 10);
        cell.innerHTML = lockerId;
        cell.className = 'border bg-success text-white';
        cell.addEventListener('click', () => {
          showOperationButtons(lockerId, cell);
        }, { once: true });
        activeCell = null;
      }

      function submitLockForm(lockerId, operation) {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/admin/lock';

        const inputId = document.createElement('input');
        inputId.type = 'hidden';
        inputId.name = 'lockId';
        inputId.value = lockerId;

        const inputOp = document.createElement('input');
        inputOp.type = 'hidden';
        inputOp.name = 'operation';
        inputOp.value = operation;

        const csrfInput = document.createElement('input');
        csrfInput.type = 'hidden';
        csrfInput.name = '_csrf';   // ここを必ず _csrf に
        csrfInput.value = csrfToken;

        form.appendChild(inputId);
        form.appendChild(inputOp);
        form.appendChild(csrfInput);

        document.body.appendChild(form);
        form.submit();
      }

      // フォーカス外れたらボタン消す
      document.addEventListener('click', (e) => {
        if (activeCell && !activeCell.contains(e.target)) {
          resetCellContent(activeCell);
        }
      });

      function updateLockerStates() {
        fetch("/api/lock/get", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            [csrfHeader]: csrfToken
          }
        })
          .then(response => response.json())
          .then(data => {
            const stateMap = {};
            data.forEach(lock => {
              stateMap[lock.id] = lock.state;
            });

            document.querySelectorAll("td[data-locker-id]").forEach(td => {
              const lockId = parseInt(td.dataset.lockerId, 10);
              const state = stateMap[lockId];

              // 一旦全色クラスをリセット
              td.classList.remove("bg-success", "bg-danger", "bg-secondary");

              if (state === "u") {
                td.classList.add("bg-success"); // 解錠
              } else if (state === "l") {
                td.classList.add("bg-danger"); // 施錠
              } else {
                td.classList.add("bg-secondary"); // 不明
              }
            });
          })
          .catch(err => {
            console.error("状態取得エラー:", err);
          });
      }


      // 初回実行と定期実行（3秒ごと）
      updateLockerStates();
      setInterval(updateLockerStates, 3000);



      createLockerTable(lockerCount);
    </script>

</body>
