<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規ユーザ登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <h1>新規ユーザ登録用一時URL</h1>
    <form th:action="@{/admin/register/new}" method="post">
        <input type="text" name="memo" placeholder="メモを入力" />
        <button type="submit">Login</button>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    </form>
    <div th:if="${msg != null}">
        <div class="alert alert-success" role="alert">
            メッセージ: <span th:text="${msg}"></span>
        </div>
    </div>
    <a href="?m=0">無効なURLも表示</a>
    <a href="?m=1">無効なURLを非表示</a>
    <table class="table">
        <thead>
            <tr>
                <th>URL</th>
                <th>メモ</th>
                <th>有効</th>
                <th>有効無効切り替え</th>
                <th>発行日</th>
                <th>期限日</th>
                <th>登録ID</th>
                <th>IPアドレス</th>
                <th>UA</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="entry : ${entries}">

                <td><a th:href="|${baseurldayo}/register?id=${entry.uuid}|" th:text="${entry.uuid}"></a></td>
                <td th:text="${entry.memo}"></td>
                <td th:text="${entry.isEnable}"></td>
                <td>
                    <form th:action="@{/admin/register/stat}" method="post">
                        <input type="hidden" name="uuid" th:value="${entry.uuid}" />
                        <input type="hidden" name="enabled" th:value="${!entry.isEnable}" />
                        <button type="submit">[ ]</button>
                    </form>
                </td>
                <td th:text="${#temporals.format(entry.created, 'yyyy-MM-dd HH:mm:ss z')}"></td>
                <td th:text="${#temporals.format(entry.expire, 'yyyy-MM-dd HH:mm:ss z')}"></td>
                <td th:text="${entry.idStr}"></td>
                <td th:text="${entry.ipAddress}"></td>
                <td th:text="${entry.userAgent}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
